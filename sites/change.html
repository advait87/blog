<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>advait.pro</title>

  <script src="https://cdn.tailwindcss.com"></script>
  <link href="https://i.postimg.cc/hGLcg8gT/icon.png" rel="icon">

  <style>
    :root {
      --transition-speed: 0.3s;
    }

    /* Light Theme */
    body[data-theme="light"] {
      --bg-color: #ffffff;
      --text-primary: #1a1a1a;
      --text-secondary: #666666;
      --accent-color: #2563eb;
      --ui-bg: #f3f4f6;
      --ui-border: #e5e7eb;
      --theme-btn-border: #d1d5db;
    }

    /* Dark Theme */
    body[data-theme="dark"] {
      --bg-color: #121212;
      --text-primary: #e5e5e5;
      --text-secondary: #a3a3a3;
      --accent-color: #60a5fa;
      --ui-bg: #262626;
      --ui-border: #404040;
      --theme-btn-border: #525252;
    }

    /* Sepia Theme */
    body[data-theme="sepia"] {
      --bg-color: #f4ecd8;
      --text-primary: #433422;
      --text-secondary: #7e6a52;
      --accent-color: #d97706;
      --ui-bg: #e6dac3;
      --ui-border: #d1c7b7;
      --theme-btn-border: #c2b5a3;
    }

    /* Base */
    body {
      background-color: var(--bg-color);
      color: var(--text-primary);
      line-height: 1.6;
      transition: background-color var(--transition-speed),
        color var(--transition-speed);
    }

    /* Fonts */
    .font-sans-system {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif;
    }

    .font-serif-times {
      font-family: "Times New Roman", Times, serif;
    }

    p {
      white-space: pre-line;
      margin-bottom: 1.5rem;
    }

    /* Controls */
    .controls-wrapper {
      position: fixed;
      top: 20px;
      right: 20px;
      display: flex;
      gap: 12px;
      z-index: 50;
    }

    .control-group {
      display: flex;
      align-items: center;
      background-color: var(--ui-bg);
      border: 1px solid var(--ui-border);
      border-radius: 9999px;
      padding: 4px 8px;
      gap: 8px;
    }

    .font-btn {
      background: none;
      border: none;
      cursor: pointer;
      padding: 4px 8px;
      border-radius: 6px;
      font-size: 1rem;
      color: var(--text-secondary);
    }

    .font-btn.active {
      color: var(--text-primary);
      font-weight: bold;
    }

    .theme-btn {
      width: 20px;
      height: 20px;
      border-radius: 50%;
      border: 1px solid var(--theme-btn-border);
      cursor: pointer;
      opacity: 0.4;
    }

    .theme-btn.active {
      opacity: 1;
      transform: scale(1.1);
    }

    .theme-btn-light {
      background: #fff;
    }

    .theme-btn-sepia {
      background: #f4ecd8;
    }

    .theme-btn-dark {
      background: #121212;
    }

    @media (max-width: 640px) {
      .controls-wrapper {
        right: 50%;
        transform: translateX(50%);
      }
    }
  </style>
</head>

<body data-theme="light" class="font-sans-system min-h-screen flex flex-col">

  <main class="flex-grow w-full max-w-2xl mx-auto px-6 py-24 sm:py-32 text-left">
    <div id="posts-container"></div>
  </main>

  <script>
    function setTheme(theme) {
      document.body.setAttribute("data-theme", theme);
      localStorage.setItem("blogTheme", theme);
      updateThemeButtons(theme);
    }

    function setFont(font) {
      document.body.classList.toggle("font-sans-system", font === "sans");
      document.body.classList.toggle("font-serif-times", font === "serif");
      localStorage.setItem("blogFont", font);
    }
    const savedTheme = localStorage.getItem("blogTheme") || "light";
    const savedFont = localStorage.getItem("blogFont") || "sans";
    setTheme(savedTheme);
    setFont(savedFont);
  </script>
  <!-- Injected data -->
  <script>
    window.BLOG_POST = {
      title: "Change",
      created_at: "Monday, April 13 2026",
      content: `
I gotta change mate. I gotta change for the better, the best. I need to be the best that I can ever be. This mediocrity is boring me, it's killing me. I don't want to spend 20 minutes thinking should I buy this warm Getoraite bottle. I just want to go in the shop and buy the expensive cold coffee, cause I want to drink it(the fact that it's not healthy is another point, maybe I'll get the protein shake). But I gotta work super fucking hard and earn a truckload of money so that I can drink that protein shake. I can buy a KFC meal, I can watch a movie just cause I've got 3 hours to kill in the mall. Or not think about the bus timings constantly. But how do I do this? Code. Code a lot. A lot. A super fucking lot. I'm thinking this:

Instead of buying a shit load of stuff from the money that I get from the internship, I live a rich life for 3 months. Eat in expensive cafes, drink anything I want(not alcohol ofc, but, nope). Watch any movive I want. Go in the cab everywhere. I don't need a new phone. Maybe I do, but more than that, I need a lifestyle change. This mediocrity is boring me. It's killing me. Motherfucker, you need to work super fucking hard. Harder than that, even harder than that. I'm getting off of music again. I'm deleting YouTube again. Not deleting, but changing the way that I consume it.
`
    };
  </script>

  <script>

    // ---------------- CONTROLS INJECTION ----------------

    document.body.insertAdjacentHTML("afterbegin", `
  <div class="controls-wrapper">
    <div class="control-group" id="theme-toggles">
      <button class="theme-btn theme-btn-light" onclick="setTheme('light')"></button>
      <button class="theme-btn theme-btn-sepia" onclick="setTheme('sepia')"></button>
      <button class="theme-btn theme-btn-dark" onclick="setTheme('dark')"></button>
    </div>

    <div class="control-group" id="font-toggles">
      <button class="font-btn font-sans-system" onclick="setFont('sans')">Aa</button>
      <button class="font-btn font-serif-times" onclick="setFont('serif')">Aa</button>
    </div>
  </div>
`);

    // ---------------- RENDER POST ----------------

    const post = window.BLOG_POST;
    const container = document.getElementById("posts-container");

    container.innerHTML = `
  <article>
    <h1 class="text-3xl sm:text-4xl mb-3">${post.title}</h1>
    <span class="text-sm text-[var(--text-secondary)]">${post.created_at}</span>
    <p class="mt-6">${post.content}</p>
  </article>
`;

    // ---------------- THEME / FONT LOGIC ----------------


    function updateThemeButtons(theme) {
      document.querySelectorAll(".theme-btn").forEach(btn =>
        btn.classList.toggle("active", btn.classList.contains(`theme-btn-${theme}`))
      );
    }

    // ---------------- INIT ----------------


  </script>
</body>

</html>
