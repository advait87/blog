<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>advait.pro</title>

  <script src="https://cdn.tailwindcss.com"></script>
  <link href="https://i.postimg.cc/hGLcg8gT/icon.png" rel="icon">

  <style>
    :root {
      --transition-speed: 0.3s;
    }

    /* Light Theme */
    body[data-theme="light"] {
      --bg-color: #ffffff;
      --text-primary: #1a1a1a;
      --text-secondary: #666666;
      --accent-color: #2563eb;
      --ui-bg: #f3f4f6;
      --ui-border: #e5e7eb;
      --theme-btn-border: #d1d5db;
    }

    /* Dark Theme */
    body[data-theme="dark"] {
      --bg-color: #121212;
      --text-primary: #e5e5e5;
      --text-secondary: #a3a3a3;
      --accent-color: #60a5fa;
      --ui-bg: #262626;
      --ui-border: #404040;
      --theme-btn-border: #525252;
    }

    /* Sepia Theme */
    body[data-theme="sepia"] {
      --bg-color: #f4ecd8;
      --text-primary: #433422;
      --text-secondary: #7e6a52;
      --accent-color: #d97706;
      --ui-bg: #e6dac3;
      --ui-border: #d1c7b7;
      --theme-btn-border: #c2b5a3;
    }

    /* Base */
    body {
      background-color: var(--bg-color);
      color: var(--text-primary);
      line-height: 1.6;
      transition: background-color var(--transition-speed),
        color var(--transition-speed);
    }

    /* Fonts */
    .font-sans-system {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif;
    }

    .font-serif-times {
      font-family: "Times New Roman", Times, serif;
    }

    p {
      white-space: pre-line;
      margin-bottom: 1.5rem;
    }

    /* Controls */
    .controls-wrapper {
      position: fixed;
      top: 20px;
      right: 20px;
      display: flex;
      gap: 12px;
      z-index: 50;
    }

    .control-group {
      display: flex;
      align-items: center;
      background-color: var(--ui-bg);
      border: 1px solid var(--ui-border);
      border-radius: 9999px;
      padding: 4px 8px;
      gap: 8px;
    }

    .font-btn {
      background: none;
      border: none;
      cursor: pointer;
      padding: 4px 8px;
      border-radius: 6px;
      font-size: 1rem;
      color: var(--text-secondary);
    }

    .font-btn.active {
      color: var(--text-primary);
      font-weight: bold;
    }

    .theme-btn {
      width: 20px;
      height: 20px;
      border-radius: 50%;
      border: 1px solid var(--theme-btn-border);
      cursor: pointer;
      opacity: 0.4;
    }

    .theme-btn.active {
      opacity: 1;
      transform: scale(1.1);
    }

    .theme-btn-light {
      background: #fff;
    }

    .theme-btn-sepia {
      background: #f4ecd8;
    }

    .theme-btn-dark {
      background: #121212;
    }

    @media (max-width: 640px) {
      .controls-wrapper {
        right: 50%;
        transform: translateX(50%);
      }
    }
  </style>
</head>

<body data-theme="light" class="font-sans-system min-h-screen flex flex-col">

  <main class="flex-grow w-full max-w-2xl mx-auto px-6 py-24 sm:py-32 text-left">
    <div id="posts-container"></div>
  </main>

  <script>
    function setTheme(theme) {
      document.body.setAttribute("data-theme", theme);
      localStorage.setItem("blogTheme", theme);
      updateThemeButtons(theme);
    }

    function setFont(font) {
      document.body.classList.toggle("font-sans-system", font === "sans");
      document.body.classList.toggle("font-serif-times", font === "serif");
      localStorage.setItem("blogFont", font);
    }
    const savedTheme = localStorage.getItem("blogTheme") || "light";
    const savedFont = localStorage.getItem("blogFont") || "sans";
    setTheme(savedTheme);
    setFont(savedFont);
  </script>
  <!-- Injected data -->
  <script>
    window.BLOG_POST = {
      title: "I'm not dead yet",
      created_at: "March 22, 2026",
      content: `
I just wanted to clarify, that just because I didn't blog for a while, doesn't mean that I'm dead. I have seen these kind of allegations float a lot, specially during the Iran Israel America threeway. The logic is, "He is quiet, so he's dead". Well I am not, also this blog is not written by any AI that was told to write in my own style. AI is not there yet, won't ever be. 

Now that we have all the conspiracies out of the way, let me write some random things about my life.

I am launching a new app. It's called dvait (don't ask why). The idea is that whatever you use on your computer, in this case your smartphone actually, it tracks that information, and you can query that information, ask questions, potentially do tasks(upcoming feature, idk). If you know Windows recall, it's like that. The thing is, it's open source. I want to do it hybrid style, like the backend will be closed source and the frontend will be open source(by frontend I mean the app, the client app). But this may still raise privacy concerns, so for that, I've got 2 solutions:

1. Clearly state in the privacy policy that I'm a good guy and more / less importantly, the server won't store any data coming from the user, not even for training, not even anonymous, just not.
2. You can bring your own API key from Groq and use their models with ZDA(Zero D-something A-something). Basically, they don't store any of their data. I hope you can trust Groq, they seem very cool to me.

I also want to have local LLM support, but I haven't been able to test it, cause I've got a Galaxy S10. Maybe when I'll get some money I will get my hands on powerful phones and do local inference. I do want it, no doubt about that. I know a vast majority of people won't be able to get the benefit from it, as most people are neither super caring about their privacy, specially when seeing a privacy centric approach like I'm taking, nor do they have the highest end flagships to do local inference. But it's us, the Geeks' job to take the technology forward. (Attach my photo here with a hand pointing to the sky and wearing a cape and a mask).

Aside from that, well, this is my attempt to become rich, no doubt about that. I'm tired of eating mess food and living in a kinda jail like IITGN (for me at least). I wanna go to Udaipur, Kerala, Spain. Anyways.


So that's that, also a pro version is coming soon...
`
    };
  </script>

  <script>

    // ---------------- CONTROLS INJECTION ----------------

    document.body.insertAdjacentHTML("afterbegin", `
  <div class="controls-wrapper">
    <div class="control-group" id="theme-toggles">
      <button class="theme-btn theme-btn-light" onclick="setTheme('light')"></button>
      <button class="theme-btn theme-btn-sepia" onclick="setTheme('sepia')"></button>
      <button class="theme-btn theme-btn-dark" onclick="setTheme('dark')"></button>
    </div>

    <div class="control-group" id="font-toggles">
      <button class="font-btn font-sans-system" onclick="setFont('sans')">Aa</button>
      <button class="font-btn font-serif-times" onclick="setFont('serif')">Aa</button>
    </div>
  </div>
`);

    // ---------------- RENDER POST ----------------

    const post = window.BLOG_POST;
    const container = document.getElementById("posts-container");

    container.innerHTML = `
  <article>
    <h1 class="text-3xl sm:text-4xl mb-3">${post.title}</h1>
    <span class="text-sm text-[var(--text-secondary)]">${post.created_at}</span>
    <p class="mt-6">${post.content}</p>
  </article>
`;

    // ---------------- THEME / FONT LOGIC ----------------


    function updateThemeButtons(theme) {
      document.querySelectorAll(".theme-btn").forEach(btn =>
        btn.classList.toggle("active", btn.classList.contains(`theme-btn-${theme}`))
      );
    }

    // ---------------- INIT ----------------


  </script>
</body>

</html>
