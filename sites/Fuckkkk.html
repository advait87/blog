<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>advait.pro</title>

  <script src="https://cdn.tailwindcss.com"></script>
  <link href="https://i.postimg.cc/hGLcg8gT/icon.png" rel="icon">

  <style>
    :root {
      --transition-speed: 0.3s;
    }

    /* Light Theme */
    body[data-theme="light"] {
      --bg-color: #ffffff;
      --text-primary: #1a1a1a;
      --text-secondary: #666666;
      --accent-color: #2563eb;
      --ui-bg: #f3f4f6;
      --ui-border: #e5e7eb;
      --theme-btn-border: #d1d5db;
    }

    /* Dark Theme */
    body[data-theme="dark"] {
      --bg-color: #121212;
      --text-primary: #e5e5e5;
      --text-secondary: #a3a3a3;
      --accent-color: #60a5fa;
      --ui-bg: #262626;
      --ui-border: #404040;
      --theme-btn-border: #525252;
    }

    /* Sepia Theme */
    body[data-theme="sepia"] {
      --bg-color: #f4ecd8;
      --text-primary: #433422;
      --text-secondary: #7e6a52;
      --accent-color: #d97706;
      --ui-bg: #e6dac3;
      --ui-border: #d1c7b7;
      --theme-btn-border: #c2b5a3;
    }

    /* Base */
    body {
      background-color: var(--bg-color);
      color: var(--text-primary);
      line-height: 1.6;
      transition: background-color var(--transition-speed),
        color var(--transition-speed);
    }

    /* Fonts */
    .font-sans-system {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif;
    }

    .font-serif-times {
      font-family: "Times New Roman", Times, serif;
    }

    p {
      white-space: pre-line;
      margin-bottom: 1.5rem;
    }

    /* Controls */
    .controls-wrapper {
      position: fixed;
      top: 20px;
      right: 20px;
      display: flex;
      gap: 12px;
      z-index: 50;
    }

    .control-group {
      display: flex;
      align-items: center;
      background-color: var(--ui-bg);
      border: 1px solid var(--ui-border);
      border-radius: 9999px;
      padding: 4px 8px;
      gap: 8px;
    }

    .font-btn {
      background: none;
      border: none;
      cursor: pointer;
      padding: 4px 8px;
      border-radius: 6px;
      font-size: 1rem;
      color: var(--text-secondary);
    }

    .font-btn.active {
      color: var(--text-primary);
      font-weight: bold;
    }

    .theme-btn {
      width: 20px;
      height: 20px;
      border-radius: 50%;
      border: 1px solid var(--theme-btn-border);
      cursor: pointer;
      opacity: 0.4;
    }

    .theme-btn.active {
      opacity: 1;
      transform: scale(1.1);
    }

    .theme-btn-light {
      background: #fff;
    }

    .theme-btn-sepia {
      background: #f4ecd8;
    }

    .theme-btn-dark {
      background: #121212;
    }

    @media (max-width: 640px) {
      .controls-wrapper {
        right: 50%;
        transform: translateX(50%);
      }
    }
  </style>
</head>

<body data-theme="light" class="font-sans-system min-h-screen flex flex-col">

  <main class="flex-grow w-full max-w-2xl mx-auto px-6 py-24 sm:py-32 text-left">
    <div id="posts-container"></div>
  </main>

  <script>
    function setTheme(theme) {
      document.body.setAttribute("data-theme", theme);
      localStorage.setItem("blogTheme", theme);
      updateThemeButtons(theme);
    }

    function setFont(font) {
      document.body.classList.toggle("font-sans-system", font === "sans");
      document.body.classList.toggle("font-serif-times", font === "serif");
      localStorage.setItem("blogFont", font);
    }
    const savedTheme = localStorage.getItem("blogTheme") || "light";
    const savedFont = localStorage.getItem("blogFont") || "sans";
    setTheme(savedTheme);
    setFont(savedFont);
  </script>
  <!-- Injected data -->
  <script>
    window.BLOG_POST = {
      title: "FUCKKKK",
      created_at: "January 25, 2026",
      content: `Well, fuckkkk.
It's 3:42 AM on Jan 25th. I did something really fucking stupid on 3:37 AM.

Truth be told, I am just very(can't emphasize enough) that my dumbass didn't put a sudo in front of the command.

So cause there was nothing noteworthy about the day, I decided to buy a domain. And I did! I was first keen to buy advait.codes, but on hostinger, it was more expensive than advait.pro. And also, I don't want my blog or my entire identity to be around coding. I do love coding, but I love problem solving, I love Cricket, I love philosophy tbh, also performance psycology. So I bought advait.pro.

Now I connected it to my vercel account and published a template next_js blog with some boilerplate code. But then I thought, I want all my code to be written by me, Organic. So I cloned the repo in my home directory. Instead of my Code directory or any other directory.

Oh fucckkkk!!! I just realized I did not put one of the important projects on Github and deleted it, the Astroul one. Nice.

So I cloned the repo in my home directory. And I did

cd blog
AND rm -rf ../* instead of rm -rf ./*
AND, I pressed y the moment it asked for my approval.


Seconds passed, I thought why is it taking so long to remove boilerplate NextJS blog. And the evil happened. Tbh I pressed couple of Ctrl Cs in those seconds, but ig nothing happened.

It said, cannot delete Desktop, permission denied, and it occured on me.

So I am just gonna sleep now, not think about it. GOOOOOOOOOOOD NIGHT.


`
    };
  </script>

  <script>

    // ---------------- CONTROLS INJECTION ----------------

    document.body.insertAdjacentHTML("afterbegin", `
  <div class="controls-wrapper">
    <div class="control-group" id="theme-toggles">
      <button class="theme-btn theme-btn-light" onclick="setTheme('light')"></button>
      <button class="theme-btn theme-btn-sepia" onclick="setTheme('sepia')"></button>
      <button class="theme-btn theme-btn-dark" onclick="setTheme('dark')"></button>
    </div>

    <div class="control-group" id="font-toggles">
      <button class="font-btn font-sans-system" onclick="setFont('sans')">Aa</button>
      <button class="font-btn font-serif-times" onclick="setFont('serif')">Aa</button>
    </div>
  </div>
`);

    // ---------------- RENDER POST ----------------

    const post = window.BLOG_POST;
    const container = document.getElementById("posts-container");

    container.innerHTML = `
  <article>
    <h1 class="text-3xl sm:text-4xl mb-3">${post.title}</h1>
    <span class="text-sm text-[var(--text-secondary)]">${post.created_at}</span>
    <p class="mt-6">${post.content}</p>
  </article>
`;

    // ---------------- THEME / FONT LOGIC ----------------


    function updateThemeButtons(theme) {
      document.querySelectorAll(".theme-btn").forEach(btn =>
        btn.classList.toggle("active", btn.classList.contains(`theme-btn-${theme}`))
      );
    }

    // ---------------- INIT ----------------


  </script>
</body>

</html>
