<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>advait.pro</title>

  <script src="https://cdn.tailwindcss.com"></script>
  <link href="https://i.postimg.cc/hGLcg8gT/icon.png" rel="icon">

  <style>
    :root {
      --transition-speed: 0.3s;
    }

    /* Light Theme */
    body[data-theme="light"] {
      --bg-color: #ffffff;
      --text-primary: #1a1a1a;
      --text-secondary: #666666;
      --accent-color: #2563eb;
      --ui-bg: #f3f4f6;
      --ui-border: #e5e7eb;
      --theme-btn-border: #d1d5db;
    }

    /* Dark Theme */
    body[data-theme="dark"] {
      --bg-color: #121212;
      --text-primary: #e5e5e5;
      --text-secondary: #a3a3a3;
      --accent-color: #60a5fa;
      --ui-bg: #262626;
      --ui-border: #404040;
      --theme-btn-border: #525252;
    }

    /* Sepia Theme */
    body[data-theme="sepia"] {
      --bg-color: #f4ecd8;
      --text-primary: #433422;
      --text-secondary: #7e6a52;
      --accent-color: #d97706;
      --ui-bg: #e6dac3;
      --ui-border: #d1c7b7;
      --theme-btn-border: #c2b5a3;
    }

    /* Base */
    body {
      background-color: var(--bg-color);
      color: var(--text-primary);
      line-height: 1.6;
      transition: background-color var(--transition-speed),
        color var(--transition-speed);
    }

    /* Fonts */
    .font-sans-system {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif;
    }

    .font-serif-times {
      font-family: "Times New Roman", Times, serif;
    }

    p {
      white-space: pre-line;
      margin-bottom: 1.5rem;
    }

    /* Controls */
    .controls-wrapper {
      position: fixed;
      top: 20px;
      right: 20px;
      display: flex;
      gap: 12px;
      z-index: 50;
    }

    .control-group {
      display: flex;
      align-items: center;
      background-color: var(--ui-bg);
      border: 1px solid var(--ui-border);
      border-radius: 9999px;
      padding: 4px 8px;
      gap: 8px;
    }

    .font-btn {
      background: none;
      border: none;
      cursor: pointer;
      padding: 4px 8px;
      border-radius: 6px;
      font-size: 1rem;
      color: var(--text-secondary);
    }

    .font-btn.active {
      color: var(--text-primary);
      font-weight: bold;
    }

    .theme-btn {
      width: 20px;
      height: 20px;
      border-radius: 50%;
      border: 1px solid var(--theme-btn-border);
      cursor: pointer;
      opacity: 0.4;
    }

    .theme-btn.active {
      opacity: 1;
      transform: scale(1.1);
    }

    .theme-btn-light {
      background: #fff;
    }

    .theme-btn-sepia {
      background: #f4ecd8;
    }

    .theme-btn-dark {
      background: #121212;
    }

    @media (max-width: 640px) {
      .controls-wrapper {
        right: 50%;
        transform: translateX(50%);
      }
    }
  </style>
</head>

<body data-theme="light" class="font-sans-system min-h-screen flex flex-col">

  <main class="flex-grow w-full max-w-2xl mx-auto px-6 py-24 sm:py-32 text-left">
    <div id="posts-container"></div>
  </main>

  <script>
    function setTheme(theme) {
      document.body.setAttribute("data-theme", theme);
      localStorage.setItem("blogTheme", theme);
      updateThemeButtons(theme);
    }

    function setFont(font) {
      document.body.classList.toggle("font-sans-system", font === "sans");
      document.body.classList.toggle("font-serif-times", font === "serif");
      localStorage.setItem("blogFont", font);
    }
    const savedTheme = localStorage.getItem("blogTheme") || "light";
    const savedFont = localStorage.getItem("blogFont") || "sans";
    setTheme(savedTheme);
    setFont(savedFont);
  </script>
  <!-- Injected data -->
  <script>
    window.BLOG_POST = {
      title: "Idk, but better",
      created_at: "Wednesday, 29 July 2026",
      content: `
So I'm in Bengaluru, or should I say I'm leaving Bengaluru in an hour, and I feel sad. Bengaluru has been the best city I've ever been to, and tbh, seems like a great place to settle in if and when I decide to.

Why am I writing this blog. I want to reminiscene about Bengaluru, even if I did not spell it correctly. But I'll do it in another blog, maybe a video or something. This is cause... well let's be honest, brain is rot, or should I say rotten. btw, I should learn grammar and English better, cause this presenting 2 options and letting the reader decide which one would be correct, though is technically correct, is not elegant. And to paraphrase (If I remember it correctly, which I didn't and I'm genuinely ashamed that I had to Google the list of physicists where I found and recognized his name) Paul Dirac, beauty is necessary.

Now back to the brain rotten part. It's for a reason, I know why do I consume a lot of the brainrot content, but the problem is when the reason takes a backseat and I still consume the content. I mean, it's meticulously designed for that. Every tiny decision in the company worth at least hundreds of billions of Dollars is made so that I get more soacked into the content present there, that I forget my problems and enjoy their app. Which doesn't sound that bad, right? That's what to some extent sports and movies do (Don't tell me you watch sports for the lessons, books are massively more efficient for lessons, and if you think it's easier to watch a movie than read a book, it's cause you watched movies for reasons beyond the lessons). But forgetting problems is just not good.

One more btw... (urghhh)
Till the time that I land in Mumbai, I'll write the blog. I won't play any song or content throughout, even when having food in the flight. This is a zen place now. So the blog will be the longest ever, probably by far. A lot of things will be irrelevant, but I just want to let everyting in my bag out on the table, so I can put what I need back into the bag, fetch something important that's missing, and drop what I don't think is necessary(tangent: Speaking of necessary and thinking necessity, I'll write a blog on my philosophy). Also, everything in the bag has to be necessary, no garbage whatsoever. I don't think watching instagram is garbage, or watching youtube is, or even rest or doing mindless things is garbage. I think it's necessary to do something that's mindless for a good mental health, and good mental health is necessary for, well that's the final for.


Now let's start with some positive news, most of which is potentially positive news, from most positive to still counts as positive:

1. I may get a job at bestlaptop.deals. It'll be fantastic, and if I start talking more about it in this blog, it'll take up the entire blog.
2. The joy of coding is back. I can code for hours, and I want to code for hours, actively. Will talk about that in cons more.
3. The skanai OA was good, I should get an interview considering 75% was the criteria, but my grades are shit and I've got a couple of backlogs, so dk how they consider that.
4. 90% chance that I'll get remote internship at Emertxe at rs. xxk per month. I love money.
5. Most of my actual problems are really non-problems. They are just roadblocks to my "success", which is much better than having actual problems.

Now let's talk about what I want to do and what I am doing.

One thing that now seems like I should stop doing is listening to music. I know, sounds crazy. And it is. Walking from hostel to AB11 without no music, why? Music just ups the dopamine for level 2 to level 6 out of 10. Ofc the problem is when it comes in my way of working, and when it comes in my way of thinking. I've avoided tough conversations with myself, cause having those conversations needs me to turn off music, which ofc is the ultimate sin.

I don't see myself listening to podcasts for the sake of listening to podcasts. It has not worked so far. If it's interesting, I can't focus on anything other than the podcast, and if it's not interesting, all the talk is just random words in the background which I time to time seek back to the last point, which is generally the point that I lost interest, till I lose it and stop the thing. 

Also I'm thirsty, and my bottle is empty, but if I leave my seat, one of the 2 people standing beside me will take the seat.

So regarding music, I think a lot more dilute music in daily life is good. Like "hit me hard and soft" rather than Punjabi music fucking my earholes. And let's try ambient and focus based music, maybe even brainfm when I'm working.

Now about work. First of all, I've got less expectations with CDS interns. I'll I'd say with 40% probability get the SkanAI intern, but they only give rs. 75k. I know that's a lot of money, given the market situation and that I'm a student whose most family members earn not a whole lot more than that, but my take is that no, I wanna more. If I get the bestlaptop.deals parttime job, it pays a lot more for working for a lot less hours doing something that's more interesting but arguably less challenging than what I may end up doing at SkanAI.

Part of my brain just wants to open the phone, open instagram to see if anyone messaged to the latest comment I put, or to open whatsapp, cause I have a notification. But I won't do that. Partly cause it's not that hard to not open it for 3-4 hours, and because ofc it's ego. I won't mind to use phone when something important comes up, but I don't see anything on the horizon.

Now the other internship option is GSoC, with I'd say 70% confidence, and summer of bitcoin, with 20% confidence. (The urge to put 69% or 67% instead of 70%).

I'm definitely at the point in my programming journey where I can help with my own implementations, I understand to some depth the stack I'm working with, and the way that I use claude, not to prompt and generate code in the codebase, but to understand the tech stack with rustlings style assignments, I think I've got the perfect approach to GSoC this time.

But that's it. I'm afraid that if I don't get SkanAI, I'll need to wait for another company which takes software developer that has less than 6.5 CPI and active backlogs, which ofc won't be many.

I'm lucky to get an intern at Emertxe. I'm ofc overqualified for the role, but looking at the hiring process and the baggage that I carry in CDS, I would've not been surprised if I did not get the role. I'm even luckier to get to 90% chance to get the remote intern, which I hope goes to 100% next week.

Now if CDS doesn't work through, I've then got GSoC. I can see myself not getting that as well. But it's different. My fate is in my own hands. I can see my progress daily. It's not let's give 100% in isolation and see what comes out in the other end, it's very, for a lack of better term, interactive.

Last time, I was incompetent. I'm more competent than that this time, but I still don't feel 100%. How do I feel 100%, by doing things that are beyond my limits. By putting my head down and thinking and acting on my goal.

The goal is ofc, money. If I get the bestlaptop.deals gig, it's possible won't work very hard on GSoC. I do think it'll be the opposite and I'll be free to ignore acads and focus on academics, but I can see myself enjoying the spoils of that intern rather than working hard to get another one which'll pay less than that.

Some other things in the bag, which I added in the bag and forgot about. One is reading books and playing games. I know one is more useful than the other, but for me, I do both of them for the sole purpose of relaxing. Given that, I won't feel bad for not opening a book or not playing games with my newly bought game controller. The point of both these things is to do what I want to do, and sometimes I don't want to do that. 

Now about YouTube. Earlier this month, I willingly changed my feed so that it's mostly tech(almost 100%, before it was ~60-70%). I thus no longer watch a lot of YouTube in my own account, I watch almost exclusively in incognito, though I pay for YT premium).

But I still watch YouTube, that too non-Tech and a lot of guilty pleasure brainrot, or worse, news. It's easy for me to say let's quit that cause that's not something I want to do with my life. But I've done that a number of times now, and I came back. Cause I cared about the news. I'm curious about it. I know it doesn't help me towards my most important goal that is money, it ofc hurts cause I watch it for more than acceptible time. 


And food, while having food, I watch content, YouTube and nowadays sitcoms.

I think environment plays a big role, the people that I hangout with the most, are not really serious, idk why, idk why they don't work super hard to earn a lot of money at a very young age, they're fine with making compromises daily and someday earning a lot of money. I'm not.

Thankfully, I've got 90% chance to earn 25k rs/month and 70% chance to earn >75k rs/month next month, both of which are ofc slightly random in ways that I got them, but they're undoubtely great sources of money. 

But to get from here to here(I'm making signs in my mind), I need to go the business route. And I will. Now that I've got Claude subscription, which was not the limitting factor, but it's a very significant boost to productivity, I'll do what it literally means to be productive(ig), create products. No idea on marketting or launching, but I'll make some products in the next few days.

I'm scared, afraid of going back to taking 5k per month from dad and survive on that, which is not bad, but not what I want. tbh it's not a bad thing, it's just not the reasonable optimum thing that's in my mind.

So code it is, right? I'll learn kotlin, I'll learn working with large codebases, writing tests, systems, networking, OS, a whole lot. But now, I'll read a book till the flight lands.







































































































`
    };
  </script>

  <script>

    // ---------------- CONTROLS INJECTION ----------------

    document.body.insertAdjacentHTML("afterbegin", `
  <div class="controls-wrapper">
    <div class="control-group" id="theme-toggles">
      <button class="theme-btn theme-btn-light" onclick="setTheme('light')"></button>
      <button class="theme-btn theme-btn-sepia" onclick="setTheme('sepia')"></button>
      <button class="theme-btn theme-btn-dark" onclick="setTheme('dark')"></button>
    </div>

    <div class="control-group" id="font-toggles">
      <button class="font-btn font-sans-system" onclick="setFont('sans')">Aa</button>
      <button class="font-btn font-serif-times" onclick="setFont('serif')">Aa</button>
    </div>
  </div>
`);

    // ---------------- RENDER POST ----------------

    const post = window.BLOG_POST;
    const container = document.getElementById("posts-container");

    container.innerHTML = `
  <article>
    <h1 class="text-3xl sm:text-4xl mb-3">${post.title}</h1>
    <span class="text-sm text-[var(--text-secondary)]">${post.created_at}</span>
    <p class="mt-6">${post.content}</p>
  </article>
`;

    // ---------------- THEME / FONT LOGIC ----------------


    function updateThemeButtons(theme) {
      document.querySelectorAll(".theme-btn").forEach(btn =>
        btn.classList.toggle("active", btn.classList.contains(`theme-btn-${theme}`))
      );
    }

    // ---------------- INIT ----------------


  </script>
</body>
