<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>advait.pro</title>

  <script src="https://cdn.tailwindcss.com"></script>
  <link href="https://i.postimg.cc/hGLcg8gT/icon.png" rel="icon">

  <style>
    :root {
      --transition-speed: 0.3s;
    }

    /* Light Theme */
    body[data-theme="light"] {
      --bg-color: #ffffff;
      --text-primary: #1a1a1a;
      --text-secondary: #666666;
      --accent-color: #2563eb;
      --ui-bg: #f3f4f6;
      --ui-border: #e5e7eb;
      --theme-btn-border: #d1d5db;
    }

    /* Dark Theme */
    body[data-theme="dark"] {
      --bg-color: #121212;
      --text-primary: #e5e5e5;
      --text-secondary: #a3a3a3;
      --accent-color: #60a5fa;
      --ui-bg: #262626;
      --ui-border: #404040;
      --theme-btn-border: #525252;
    }

    /* Sepia Theme */
    body[data-theme="sepia"] {
      --bg-color: #f4ecd8;
      --text-primary: #433422;
      --text-secondary: #7e6a52;
      --accent-color: #d97706;
      --ui-bg: #e6dac3;
      --ui-border: #d1c7b7;
      --theme-btn-border: #c2b5a3;
    }

    /* Base */
    body {
      background-color: var(--bg-color);
      color: var(--text-primary);
      line-height: 1.6;
      transition: background-color var(--transition-speed),
        color var(--transition-speed);
    }

    /* Fonts */
    .font-sans-system {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif;
    }

    .font-serif-times {
      font-family: "Times New Roman", Times, serif;
    }

    p {
      white-space: pre-line;
      margin-bottom: 1.5rem;
    }

    /* Controls */
    .controls-wrapper {
      position: fixed;
      top: 20px;
      right: 20px;
      display: flex;
      gap: 12px;
      z-index: 50;
    }

    .control-group {
      display: flex;
      align-items: center;
      background-color: var(--ui-bg);
      border: 1px solid var(--ui-border);
      border-radius: 9999px;
      padding: 4px 8px;
      gap: 8px;
    }

    .font-btn {
      background: none;
      border: none;
      cursor: pointer;
      padding: 4px 8px;
      border-radius: 6px;
      font-size: 1rem;
      color: var(--text-secondary);
    }

    .font-btn.active {
      color: var(--text-primary);
      font-weight: bold;
    }

    .theme-btn {
      width: 20px;
      height: 20px;
      border-radius: 50%;
      border: 1px solid var(--theme-btn-border);
      cursor: pointer;
      opacity: 0.4;
    }

    .theme-btn.active {
      opacity: 1;
      transform: scale(1.1);
    }

    .theme-btn-light {
      background: #fff;
    }

    .theme-btn-sepia {
      background: #f4ecd8;
    }

    .theme-btn-dark {
      background: #121212;
    }

    @media (max-width: 640px) {
      .controls-wrapper {
        right: 50%;
        transform: translateX(50%);
      }
    }
  </style>
</head>

<body data-theme="light" class="font-sans-system min-h-screen flex flex-col">

  <main class="flex-grow w-full max-w-2xl mx-auto px-6 py-24 sm:py-32 text-left">
    <div id="posts-container"></div>
  </main>

  <script>
    function setTheme(theme) {
      document.body.setAttribute("data-theme", theme);
      localStorage.setItem("blogTheme", theme);
      updateThemeButtons(theme);
    }

    function setFont(font) {
      document.body.classList.toggle("font-sans-system", font === "sans");
      document.body.classList.toggle("font-serif-times", font === "serif");
      localStorage.setItem("blogFont", font);
    }
    const savedTheme = localStorage.getItem("blogTheme") || "light";
    const savedFont = localStorage.getItem("blogFont") || "sans";
    setTheme(savedTheme);
    setFont(savedFont);
  </script>
  <!-- Injected data -->
  <script>
    window.BLOG_POST = {
      title: "I need to code",
      created_at: "Sunday, 5 April 2026",
      content: `
So it's 1:37 AM on 5 April and I need to code a lot more. Just a lot more. I stopped going to the college so that I can code a lot more. Should I uninstall Antigravity? No, cause I want that for dvait.  For anything else, I should code by hand, right? Pretty much yes. The thing is, I don't know a lot/most things. And because of that, whatever the LLM spits out, that's my benchmark/de facto information about that topic. Now an LLM is by all intensive purposes(I think I got this saying wrong, who cares) an average of the internet. Not exactly, but still, it's either the statistical average of the public opinion, or it's a biased take of whichever engineer gave it the data to be trained on. I want neither. Actually, I want both, but both is not the only things I want, I want a lot more. A lot more articles, forums, trial and errors, reading error messages. I get it, the insane speed by which you can get the answer for your particular question on the LLM is unbeaten. Forums can't match that. But I think that's also its weakness. Cause it'll just tell me what I asked for, so if I'm asking for a local minima, or a not-so novel or overly complex question, it'll answer in that way. If I ask a broad question, it'll almost always answer what it was trained on, which is not wrong, but it's static. I can't imagine an intelligent being static. The special things about humans is that we learn and and generate information at real time, LLMs will probably get to do that someday, it's not today, but I think like most problems, we'll solve this one, and frankly, I don't think it'll take a lot more if properly thought.

But what do I do? First of all, I'll remake this entire website. From my own bare hands. Let's use htmx, and rust-axum. But I won't use an LLM. Cause as I said, for specific answers, I won't be able to get the full picture, and frankly, when I get a response from an LLM, my immediate action is almost always copy the code into the terminal, run it, if it works, move on. If it doesn't, most of the times, I'm totally unaware of the error message, cause it's at best not loaded in my latest memory and at worst a concept completely alien to me.

At last, the title here is I need to code. By that I mean, I should just code for a lot more time than I currently am. When bored, I'll get my hands at silly 2d game dev or solve dsa problems. I'll make some useless LLMs if I want, but I'll code a lot lot more. I need to get my muscle memory strong. Today I felt my hands cold and slow when all I had to do was create a system where 2 LLMs give answers to a question and the system outputs answer will both of them agree. I knew I could do this, but I felt the constant urge to just open antigravity and type out what I want and get the results(which I eventually did, it fucked up the first time, but got correct in the next try). And that's why, I need to code a lot more. Wish me luck.

Gracias. Adios.
`
    };
  </script>

  <script>

    // ---------------- CONTROLS INJECTION ----------------

    document.body.insertAdjacentHTML("afterbegin", `
  <div class="controls-wrapper">
    <div class="control-group" id="theme-toggles">
      <button class="theme-btn theme-btn-light" onclick="setTheme('light')"></button>
      <button class="theme-btn theme-btn-sepia" onclick="setTheme('sepia')"></button>
      <button class="theme-btn theme-btn-dark" onclick="setTheme('dark')"></button>
    </div>

    <div class="control-group" id="font-toggles">
      <button class="font-btn font-sans-system" onclick="setFont('sans')">Aa</button>
      <button class="font-btn font-serif-times" onclick="setFont('serif')">Aa</button>
    </div>
  </div>
`);

    // ---------------- RENDER POST ----------------

    const post = window.BLOG_POST;
    const container = document.getElementById("posts-container");

    container.innerHTML = `
  <article>
    <h1 class="text-3xl sm:text-4xl mb-3">${post.title}</h1>
    <span class="text-sm text-[var(--text-secondary)]">${post.created_at}</span>
    <p class="mt-6">${post.content}</p>
  </article>
`;

    // ---------------- THEME / FONT LOGIC ----------------


    function updateThemeButtons(theme) {
      document.querySelectorAll(".theme-btn").forEach(btn =>
        btn.classList.toggle("active", btn.classList.contains(`theme-btn-${theme}`))
      );
    }

    // ---------------- INIT ----------------


  </script>
</body>

</html>
